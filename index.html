<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KàdduPay - Le paiement 100% gratuit</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b1329;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            height: 100vh;
            height: 100dvh;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="h-full">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Composant du Logo Officiel "KP" (Choix #4 exact)
        const KadduPayLogo = ({ className = "h-10" }) => (
            <div className={`flex items-center space-x-2.5 ${className}`}>
                {/* Icône KP vectorielle stylisée */}
                <svg viewBox="0 0 100 80" className="h-full w-auto flex-shrink-0" fill="none" xmlns="http://www.w3.org/2000/svg">
                    {/* Branche "K" Orange avec flèche */}
                    <path d="M15 10V70M15 42L45 10H60L30 42M45 42L25 22" stroke="#F97316" strokeWidth="12" strokeLinecap="round" strokeLinejoin="round"/>
                    {/* Boucle "P" Bleu Marine entrelacée */}
                    <path d="M40 42C55 42 65 32 65 20C65 8 55 10 38 10H30V70" stroke="#1E3A8A" strokeWidth="11" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
                {/* Texte KàdduPay */}
                <div className="flex flex-col justify-center leading-none">
                    <span className="font-extrabold text-xl tracking-tight text-[#F97316]">Kàddu</span>
                    <span className="font-extrabold text-xl tracking-tight text-[#38BDF8] -mt-1">Pay</span>
                </div>
            </div>
        );

        function App() {
            const [screen, setScreen] = useState('phone');
            const [phone, setPhone] = useState('');
            const [pin, setPin] = useState(['', '', '', '']);
            
            const [balance, setBalance] = useState(150000);
            const [recipient, setRecipient] = useState('');
            const [amount, setAmount] = useState('');
            const [transactions, setTransactions] = useState([
                { id: 1, type: 'reception', name: 'Moussa Diop', amount: '+ 25 000 FCFA', date: 'Aujourd\'hui 14:30' }
            ]);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
                const savedPhone = localStorage.getItem('kaddupay_phone');
                const savedPin = localStorage.getItem('kaddupay_pin');
                const savedBalance = localStorage.getItem('kaddupay_balance');
                const savedTx = localStorage.getItem('kaddupay_tx');

                if (savedPhone && savedPin) {
                    setPhone(savedPhone);
                    setBalance(savedBalance ? Number(savedBalance) : 150000);
                    if (savedTx) setTransactions(JSON.parse(savedTx));
                    setScreen('pin_login');
                }
            }, []);

            const updateStorage = (newBalance, newTx) => {
                localStorage.setItem('kaddupay_balance', newBalance);
                localStorage.setItem('kaddupay_tx', JSON.stringify(newTx));
            };

            const handlePhoneSubmit = (e) => {
                e.preventDefault();
                if (!phone || phone.length < 8) return alert('Veuillez entrer un numéro valide.');
                
                const existingPhone = localStorage.getItem('kaddupay_phone');
                if (existingPhone === phone) {
                    setScreen('pin_login');
                } else {
                    setScreen('pin_setup');
                }
            };

            const handlePinSubmit = (e) => {
                e.preventDefault();
                const fullPin = pin.join('');
                if (fullPin.length < 4) {
                    return alert('Veuillez saisir votre code à 4 chiffres.');
                }

                if (screen === 'pin_setup') {
                    localStorage.setItem('kaddupay_phone', phone);
                    localStorage.setItem('kaddupay_pin', fullPin);
                    updateStorage(balance, transactions);
                    setScreen('dashboard');
                } else if (screen === 'pin_login') {
                    const savedPin = localStorage.getItem('kaddupay_pin');
                    if (fullPin === savedPin) {
                        setScreen('dashboard');
                    } else {
                        alert('Code secret incorrect.');
                        setPin(['', '', '', '']);
                    }
                }
            };

            const handlePinInput = (val, index) => {
                const newPin = [...pin];
                newPin[index] = val;
                setPin(newPin);

                if (val && index < 3) {
                    const nextInput = document.getElementById(`pin-${index + 1}`);
                    if (nextInput) nextInput.focus();
                }
            };

            const handleSendMoney = (e) => {
                e.preventDefault();
                const numericAmount = Number(amount);
                if (!recipient || !numericAmount || numericAmount <= 0) {
                    return alert('Veuillez remplir correctement les informations.');
                }
                if (numericAmount > balance) {
                    return alert('Solde insuffisant.');
                }
                
                const newBalance = balance - numericAmount;
                const newTxList = [
                    { id: Date.now(), type: 'envoi', name: recipient, amount: `- ${numericAmount.toLocaleString('fr-FR')} FCFA`, date: 'À l\'instant' },
                    ...transactions
                ];

                setBalance(newBalance);
                setTransactions(newTxList);
                updateStorage(newBalance, newTxList);

                alert('Transfert de ' + numericAmount.toLocaleString('fr-FR') + ' FCFA effectué avec succès sans aucun frais !');
                setRecipient('');
                setAmount('');
                setScreen('dashboard');
            };

            const logout = () => {
                localStorage.clear();
                setPhone('');
                setPin(['', '', '', '']);
                setScreen('phone');
            };

            return (
                <div className="flex flex-col h-full max-w-md mx-auto w-full bg-[#0b1329] p-5 justify-between">
                    
                    {/* 1. ÉCRAN NUMÉRO DE TÉLÉPHONE */}
                    {screen === 'phone' && (
                        <div className="flex flex-col justify-between h-full py-4">
                            <div>
                                <div className="pt-2">
                                    <KadduPayLogo className="h-12" />
                                </div>

                                <div className="mt-12 space-y-3">
                                    <div className="inline-flex items-center space-x-2 bg-orange-500/10 border border-orange-500/20 px-3 py-1 rounded-full text-orange-400 text-xs font-semibold">
                                        ⚡ Simple, Instantané & 0 Frais
                                    </div>
                                    <h1 className="text-3xl font-extrabold tracking-tight text-white">
                                        Entrez votre numéro
                                    </h1>
                                    <p className="text-slate-400 text-sm">
                                        Pour accéder à votre solde ou créer votre compte KàdduPay.
                                    </p>
                                </div>

                                <form onSubmit={handlePhoneSubmit} className="mt-8 space-y-4">
                                    <div className="flex items-center bg-slate-800/80 border border-slate-700 rounded-2xl p-4 focus-within:border-orange-500 transition-colors">
                                        <div className="flex items-center space-x-2 pr-3 border-r border-slate-700">
                                            <span className="text-lg">🇸🇳</span>
                                            <span className="text-sm font-semibold text-slate-200">+221</span>
                                        </div>
                                        <input 
                                            type="tel" 
                                            value={phone}
                                            onChange={(e) => setPhone(e.target.value)}
                                            placeholder="77 000 00 00" 
                                            className="bg-transparent pl-3 w-full text-white placeholder-slate-500 focus:outline-none text-lg font-bold"
                                            required
                                        />
                                    </div>

                                    <button 
                                        type="submit"
                                        className="w-full bg-gradient-to-r from-orange-600 to-amber-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-orange-600/30 active:scale-[0.99] transition-transform text-base mt-6"
                                    >
                                        Continuer
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 2. ÉCRAN CODE SECRET (PIN 4 CHIFFRES) */}
                    {(screen === 'pin_setup' || screen === 'pin_login') && (
                        <div className="flex flex-col justify-between h-full py-4">
                            <div>
                                <button onClick={() => setScreen('phone')} className="text-slate-400 text-sm flex items-center space-x-1 pt-2">
                                    <span>← Retour</span>
                                </button>

                                <div className="mt-8 space-y-2 text-center">
                                    <div className="flex justify-center mb-4">
                                        <KadduPayLogo className="h-10" />
                                    </div>
                                    <h1 className="text-2xl font-bold tracking-tight text-white">
                                        {screen === 'pin_setup' ? 'Créez votre code secret' : 'Entrez votre code secret'}
                                    </h1>
                                    <p className="text-slate-400 text-sm">
                                        {screen === 'pin_setup' ? 'Définissez 4 chiffres pour sécuriser votre compte.' : '+221 ' + phone}
                                    </p>
                                </div>

                                <form onSubmit={handlePinSubmit} className="mt-8 space-y-8">
                                    <div className="flex justify-center space-x-3">
                                        {[0, 1, 2, 3].map((index) => (
                                            <input 
                                                id={`pin-${index}`}
                                                key={index}
                                                type="password" 
                                                maxLength="1"
                                                value={pin[index]}
                                                onChange={(e) => handlePinInput(e.target.value, index)}
                                                className="w-16 h-16 bg-slate-800 border border-slate-700 rounded-2xl text-center text-3xl font-bold text-white focus:border-orange-500 focus:outline-none"
                                            />
                                        ))}
                                    </div>

                                    <button 
                                        type="submit"
                                        className="w-full bg-gradient-to-r from-orange-600 to-amber-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-orange-600/30 active:scale-[0.99] transition-transform text-base"
                                    >
                                        Confirmer le code secret
                                    </button>
                                </form>
                            </div>
                            <p className="text-xs text-center text-slate-500">Sécurité KàdduPay</p>
                        </div>
                    )}

                    {/* 3. TABLEAU DE BORD CLIENT */}
                    {screen === 'dashboard' && (
                        <div className="flex flex-col h-full justify-between py-2 space-y-6 overflow-y-auto">
                            <div>
                                <div className="flex items-center justify-between">
                                    <KadduPayLogo className="h-9" />
                                    <button onClick={logout} className="bg-slate-800 p-2.5 rounded-xl border border-slate-700 text-slate-400 text-xs font-semibold">
                                        Verrouiller
                                    </button>
                                </div>

                                <div className="mt-6 bg-gradient-to-br from-slate-800 via-slate-800/90 to-slate-900 border border-slate-700/80 rounded-3xl p-6 shadow-2xl relative overflow-hidden text-center">
                                    <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Solde disponible (+221 {phone})</p>
                                    <div className="text-4xl font-extrabold text-white mt-2 tracking-tight">
                                        {balance.toLocaleString('fr-FR')} <span className="text-orange-400 text-xl">FCFA</span>
                                    </div>
                                    <div className="mt-4 inline-flex items-center space-x-2 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full text-emerald-400 text-xs font-semibold">
                                        ✓ 0 FCFA de frais sur les transferts
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-4 mt-6">
                                    <button 
                                        onClick={() => setScreen('send')}
                                        className="bg-gradient-to-r from-orange-600 to-amber-500 text-white p-4 rounded-2xl font-bold flex flex-col items-center justify-center space-y-2 shadow-lg shadow-orange-600/20 active:scale-[0.98] transition-transform"
                                    >
                                        <i data-lucide="send" className="w-6 h-6"></i>
                                        <span>Envoyer</span>
                                    </button>
                                    <button 
                                        onClick={() => alert('Option de dépôt / recharge.')}
                                        className="bg-slate-800 border border-slate-700 text-slate-200 p-4 rounded-2xl font-bold flex flex-col items-center justify-center space-y-2 active:scale-[0.98] transition-transform"
                                    >
                                        <i data-lucide="download" className="w-6 h-6 text-orange-400"></i>
                                        <span>Recharger</span>
                                    </button>
                                </div>

                                <div className="mt-8 space-y-4">
                                    <h3 className="text-sm font-bold uppercase tracking-wider text-slate-400">Historique</h3>
                                    <div className="space-y-3">
                                        {transactions.map(tx => (
                                            <div key={tx.id} className="bg-slate-800/50 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
                                                <div>
                                                    <p className="font-semibold text-sm text-white">{tx.name}</p>
                                                    <p className="text-xs text-slate-500">{tx.date}</p>
                                                </div>
                                                <span className={`font-bold text-sm ${tx.type === 'reception' ? 'text-emerald-400' : 'text-slate-200'}`}>
                                                    {tx.amount}
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 4. ÉCRAN D'ENVOI D'ARGENT */}
                    {screen === 'send' && (
                        <div className="flex flex-col justify-between h-full py-2">
                            <div>
                                <button onClick={() => setScreen('dashboard')} className="text-slate-400 text-sm flex items-center space-x-1 pt-2">
                                    <span>← Retour</span>
                                </button>

                                <div className="mt-6 space-y-2">
                                    <h1 className="text-2xl font-bold tracking-tight text-white">
                                        Envoyer de l'argent
                                    </h1>
                                    <p className="text-slate-400 text-sm">
                                        Zéro frais de transfert.
                                    </p>
                                </div>

                                <form onSubmit={handleSendMoney} className="mt-6 space-y-4">
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-semibold text-slate-300 uppercase tracking-wider">Destinataire</label>
                                        <div className="bg-slate-800/80 border border-slate-700 rounded-2xl p-3.5 focus-within:border-orange-500 transition-colors">
                                            <input 
                                                type="text" 
                                                value={recipient}
                                                onChange={(e) => setRecipient(e.target.value)}
                                                placeholder="77 000 00 00 ou Nom" 
                                                className="bg-transparent w-full text-white placeholder-slate-500 focus:outline-none text-base font-semibold"
                                                required
                                            />
                                        </div>
                                    </div>

                                    <div className="space-y-1.5">
                                        <label className="text-xs font-semibold text-slate-300 uppercase tracking-wider">Montant (FCFA)</label>
                                        <div className="flex items-center bg-slate-800/80 border border-slate-700 rounded-2xl p-3.5 focus-within:border-orange-500 transition-colors">
                                            <input 
                                                type="number" 
                                                value={amount}
                                                onChange={(e) => setAmount(e.target.value)}
                                                placeholder="0" 
                                                className="bg-transparent w-full text-2xl font-bold text-white placeholder-slate-600 focus:outline-none"
                                                required
                                            />
                                            <span className="text-slate-400 font-semibold pl-2">FCFA</span>
                                        </div>
                                    </div>

                                    <div className="bg-slate-800/40 border border-slate-800/80 p-4 rounded-2xl flex items-center justify-between text-sm">
                                        <span className="text-slate-400">Frais</span>
                                        <span className="text-emerald-400 font-bold">0 FCFA</span>
                                    </div>

                                    <button 
                                        type="submit"
                                        className="w-full bg-gradient-to-r from-orange-600 to-amber-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-orange-600/30 active:scale-[0.99] transition-transform text-base mt-4"
                                    >
                                        Envoyer
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
