<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KàdduPay - Paiement sans frais au Sénégal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel pour JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b1329;
            color: #f8fafc;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
    </style>
</head>
<body class="h-full overflow-x-hidden">
    <div id="root" class="h-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [step, setStep] = useState(1);
            const [phone, setPhone] = useState('');
            const [amount, setAmount] = useState('');

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            return (
                <div className="flex flex-col h-full max-w-md mx-auto w-full bg-[#0b1329] justify-between p-5 safe-bottom">
                    <!-- En-tête -->
                    <div className="flex items-center justify-between pt-2">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center shadow-lg shadow-orange-600/30">
                                <span className="text-white font-bold text-xl">K</span>
                            </div>
                            <span className="font-bold text-xl tracking-tight text-white">KàdduPay</span>
                        </div>
                        <div className="bg-slate-800/80 border border-slate-700/50 px-3 py-1.5 rounded-full text-xs font-medium text-slate-300">
                            Étape {step} sur 2
                        </div>
                    </div>

                    <!-- Barre de progression -->
                    <div className="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden mt-4">
                        <div 
                            className="bg-gradient-to-r from-orange-500 to-amber-500 h-full transition-all duration-300"
                            style={{ width: step === 1 ? '50%' : '100%' }}
                        ></div>
                    </div>

                    <!-- Contenu principal -->
                    <div className="my-auto py-6 space-y-6">
                        <div className="inline-flex items-center space-x-2 bg-orange-500/10 border border-orange-500/20 px-3 py-1 rounded-full text-orange-400 text-xs font-semibold">
                            <i data-lucide="zap" className="w-3.5 h-3.5"></i>
                            <span>Paiement instantané sans frais</span>
                        </div>

                        {step === 1 ? (
                            <div className="space-y-4">
                                <h1 className="text-2xl font-bold tracking-tight text-white">
                                    Le transfert d'argent 100% gratuit au Sénégal.
                                </h1>
                                <p className="text-slate-400 text-sm">
                                    Zéro frais sur tous vos transferts et règlements. Entrez votre numéro pour commencer.
                                </p>

                                <div className="space-y-2 pt-2">
                                    <label className="text-xs font-semibold text-slate-300 uppercase tracking-wider">Numéro de Téléphone</label>
                                    <div className="flex items-center bg-slate-800/80 border border-slate-700 rounded-2xl p-3 focus-within:border-orange-500 transition-colors">
                                        <div className="flex items-center space-x-2 pr-3 border-r border-slate-700">
                                            <span className="text-lg">🇸🇳</span>
                                            <span className="text-sm font-semibold text-slate-200">+221</span>
                                        </div>
                                        <input 
                                            type="tel" 
                                            value={phone}
                                            onChange={(e) => setPhone(e.target.value)}
                                            placeholder="77 000 00 00" 
                                            className="bg-transparent pl-3 w-full text-white placeholder-slate-500 focus:outline-none text-base"
                                        />
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                <h1 className="text-2xl font-bold tracking-tight text-white">
                                    Montant du paiement
                                </h1>
                                <p className="text-slate-400 text-sm">
                                    Indiquez le montant à transférer ou à régler au marchand.
                                </p>

                                <div className="space-y-2 pt-2">
                                    <label className="text-xs font-semibold text-slate-300 uppercase tracking-wider">Montant (FCFA)</label>
                                    <div className="flex items-center bg-slate-800/80 border border-slate-700 rounded-2xl p-4 focus-within:border-orange-500 transition-colors">
                                        <input 
                                            type="number" 
                                            value={amount}
                                            onChange={(e) => setAmount(e.target.value)}
                                            placeholder="0" 
                                            className="bg-transparent w-full text-2xl font-bold text-white placeholder-slate-600 focus:outline-none"
                                        />
                                        <span className="text-slate-400 font-semibold pl-2">FCFA</span>
                                    </div>
                                </div>

                                <div className="bg-slate-800/40 border border-slate-800 p-4 rounded-2xl flex items-center justify-between text-sm">
                                    <span className="text-slate-400">Frais de transaction</span>
                                    <span className="text-emerald-400 font-bold">0 FCFA (Gratuit)</span>
                                </div>
                            </div>
                        )}
                    </div>

                    <!-- Bouton d'action bas de page -->
                    <div className="pt-4">
                        <button 
                            onClick={() => {
                                if (step === 1) setStep(2);
                                else alert('Paiement validé avec succès !');
                            }}
                            className="w-full bg-gradient-to-r from-orange-600 to-amber-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-orange-600/30 active:scale-[0.99] transition-transform flex items-center justify-center space-x-2 text-base"
                        >
                            <span>{step === 1 ? 'Continuer' : 'Payer maintenant'}</span>
                            <i data-lucide="arrow-right" className="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
