<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KàdduPay - Paiement Mobile Sans Frais au Sénégal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- QRCode Generator Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Html5 Qrcode Scanner Script -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b1329;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            height: 100vh;
            height: 100dvh;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="h-full">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDqqIU5pOJtYJsMW5cvPPg3kTa0IAUsXhQ",
            authDomain: "kaadupay.firebaseapp.com",
            databaseURL: "https://kaadupay-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kaadupay",
            storageBucket: "kaadupay.firebasestorage.app",
            messagingSenderId: "996765843976",
            appId: "1:996765843976:web:fa4312ffef199add3007bd",
            measurementId: "G-SWYYHXPXR5"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const PAYDUNYA_CONFIG = {
            mode: "test",
            master_key: "test_master_key_...",
            private_key: "test_private_key_...",
            public_key: "test_public_key_..."
        };

        const KadduPayLogo = ({ className = "h-12" }) => (
            <div className={`flex items-center space-x-3 ${className}`}>
                <svg viewBox="0 0 100 110" className="h-full w-auto flex-shrink-0 drop-shadow-md" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 10H42V100H15Z" fill="#C27838" />
                    <path d="M20 15H37V95H20Z" fill="#1E293B" />
                    <path d="M42 55L78 10H100L58 60L100 100H76L42 58V55Z" fill="#C27838" />
                    <path d="M42 50L75 15H88L55 52Z" fill="#1E3A8A" />
                    <path d="M52 56L85 95H72L42 60Z" fill="#1E3A8A" />
                    <path d="M68 22C68 22 75 18 82 24C86 27 84 32 80 34C75 36 70 32 68 22Z" fill="#F97316" />
                    <circle cx="76" cy="25" r="2.5" fill="#FFFFFF" />
                    <polygon points="82,26 90,28 83,31" fill="#F97316" />
                </svg>
                <div className="flex flex-col justify-center leading-none">
                    <span className="font-extrabold text-2xl tracking-tight text-[#F97316]">Kàddu</span>
                    <span className="font-extrabold text-2xl tracking-tight text-[#1E3A8A] mt-0.5">Pay</span>
                </div>
            </div>
        );

        const DynamicQRCode = ({ value }) => {
            const qrContainerRef = useRef(null);

            useEffect(() => {
                if (qrContainerRef.current && window.QRCode) {
                    qrContainerRef.current.innerHTML = "";
                    new window.QRCode(qrContainerRef.current, {
                        text: value,
                        width: 140,
                        height: 140,
                        colorDark : "#0b1329",
                        colorLight : "#ffffff",
                        correctLevel : window.QRCode.CorrectLevel.H
                    });
                }
            }, [value]);

            return <div ref={qrContainerRef} className="flex justify-center items-center"></div>;
        };

        function App() {
            const [screen, setScreen] = useState('phone');
            const [phone, setPhone] = useState('');
            const [isNewUser, setIsNewUser] = useState(false);
            const [pin, setPin] = useState(['', '', '', '']);
            
            const [balance, setBalance] = useState(150000);
            const [userName, setUserName] = useState('Utilisateur KàdduPay');
            const [recipient, setRecipient] = useState('');
            const [amount, setAmount] = useState('');
            
            const [depositAmount, setDepositAmount] = useState('');
            const [depositProvider, setDepositProvider] = useState('Orange Money');
            
            const [withdrawAmount, setWithdrawAmount] = useState('');
            const [withdrawProvider, setWithdrawProvider] = useState('Orange Money');
            const [withdrawPhone, setWithdrawPhone] = useState('');

            const [transactions, setTransactions] = useState([]);
            const [newPinVal, setNewPinVal] = useState('');
            const qrInstanceRef = useRef(null);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
                const savedPhone = localStorage.getItem('kaddupay_phone');
                if (savedPhone) {
                    setPhone(savedPhone);
                    checkUserExists(savedPhone);
                }
            }, []);

            // Vérifie dans Firebase si le numéro existe déjà ou non
            const checkUserExists = (targetPhone) => {
                db.ref('users/' + targetPhone).once('value').then((snapshot) => {
                    if (snapshot.exists()) {
                        setIsNewUser(false);
                        setScreen('pin_login');
                        setupCloudSync(targetPhone);
                    } else {
                        setIsNewUser(true);
                        setScreen('pin_login'); // Écran de création de code pour les nouveaux
                    }
                });
            };

            useEffect(() => {
                let isMounted = true;

                if (screen === 'scan') {
                    const timeoutId = setTimeout(() => {
                        if (!document.getElementById("reader")) return;
                        
                        const html5QrCode = new Html5Qrcode("reader");
                        qrInstanceRef.current = html5QrCode;

                        html5QrCode.start(
                            { facingMode: "environment" },
                            { fps: 10, qrbox: { width: 220, height: 220 } },
                            (decodedText) => {
                                if (!isMounted) return;

                                let scannedNumber = decodedText;
                                if (scannedNumber.includes(':')) {
                                    scannedNumber = scannedNumber.split(':')[1];
                                }
                                scannedNumber = scannedNumber.replace('+221', '').replace(/\s+/g, '').trim();

                                if (scannedNumber === phone.trim()) {
                                    alert("Vous ne pouvez pas vous envoyer de l'argent à vous-même !");
                                    return;
                                }

                                setRecipient(scannedNumber);
                                
                                if (qrInstanceRef.current) {
                                    qrInstanceRef.current.stop().then(() => {
                                        qrInstanceRef.current = null;
                                        setScreen('send');
                                    }).catch(() => {
                                        qrInstanceRef.current = null;
                                        setScreen('send');
                                    });
                                } else {
                                    setScreen('send');
                                }
                            },
                            () => {}
                        ).catch((err) => {
                            console.error("Erreur accès caméra:", err);
                        });
                    }, 300);

                    return () => {
                        isMounted = false;
                        clearTimeout(timeoutId);
                        if (qrInstanceRef.current) {
                            qrInstanceRef.current.stop().catch(() => {});
                            qrInstanceRef.current = null;
                        }
                    };
                }
            }, [screen, phone]);

            const setupCloudSync = (targetPhone) => {
                db.ref('users/' + targetPhone).on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        setBalance(data.balance ?? 150000);
                        setUserName(data.name ?? `Client +221 ${targetPhone}`);
                        setTransactions(data.transactions ? Object.values(data.transactions).reverse() : []);
                    }
                });
            };

            const handlePhoneSubmit = (e) => {
                e.preventDefault();
                const cleanPhone = phone.trim();
                if (!cleanPhone || cleanPhone.length < 8) return alert('Numéro invalide.');
                localStorage.setItem('kaddupay_phone', cleanPhone);
                checkUserExists(cleanPhone);
            };

            const handlePinSubmit = (e) => {
                e.preventDefault();
                if (pin.some(digit => digit === '') || pin.join('').length !== 4) {
                    return alert('Veuillez entrer les 4 chiffres de votre code PIN.');
                }

                const fullPin = pin.join('');
                const cleanPhone = phone.trim();

                db.ref('users/' + cleanPhone).once('value').then((snapshot) => {
                    const userData = snapshot.val();
                    
                    if (!userData) {
                        // CRÉATION DU COMPTE AVEC LE VRAI PIN CHOISI PAR L'UTILISATEUR
                        const defaultName = `Client +221 ${cleanPhone.slice(-6)}`;
                        db.ref('users/' + cleanPhone).set({
                            pin: fullPin,
                            balance: 150000,
                            name: defaultName,
                            transactions: {
                                1: { id: 1, type: 'reception', name: 'Bonus KàdduPay', amount: '+ 150 000 FCFA', date: 'Bienvenue' }
                            }
                        }).then(() => {
                            localStorage.setItem('kaddupay_pin', fullPin);
                            setupCloudSync(cleanPhone);
                            setScreen('dashboard');
                        });
                    } else {
                        // CONNEXION D'UN UTILISATEUR EXISTANT
                        if (userData.pin && userData.pin !== fullPin) {
                            alert('Code secret incorrect !');
                            setPin(['', '', '', '']);
                            document.getElementById('pin-0')?.focus();
                            return;
                        }
                        localStorage.setItem('kaddupay_pin', fullPin);
                        setupCloudSync(cleanPhone);
                        setScreen('dashboard');
                    }
                }).catch(() => {
                    alert('Erreur de connexion au serveur. Réessayez.');
                });
            };

            const handlePinInput = (val, index) => {
                const cleanVal = val.replace(/[^0-9]/g, '').slice(-1);
                const newPinState = [...pin];
                newPinState[index] = cleanVal;
                setPin(newPinState);
                if (cleanVal && index < 3) {
                    document.getElementById(`pin-${index + 1}`)?.focus();
                }
            };

            const handleSendMoney = (e) => {
                e.preventDefault();
                const numericAmount = Number(amount);
                const cleanRecipient = recipient.replace(/\s+/g, '').trim();

                if (!cleanRecipient || !numericAmount || numericAmount <= 0) return alert('Champs incorrects.');
                
                if (cleanRecipient === phone.trim()) {
                    return alert("Erreur : Vous ne pouvez pas vous transférer de l'argent à vous-même !");
                }

                if (numericAmount > balance) return alert('Solde insuffisant.');

                const senderRef = db.ref('users/' + phone);
                const receiverRef = db.ref('users/' + cleanRecipient);

                receiverRef.once('value').then((snapshot) => {
                    let receiverData = snapshot.val();
                    const txId = Date.now();
                    const nowStr = 'À l\'instant';

                    const newSenderBalance = balance - numericAmount;
                    const newTxSender = {
                        id: txId,
                        type: 'envoi',
                        name: cleanRecipient,
                        amount: `- ${numericAmount.toLocaleString('fr-FR')} FCFA`,
                        date: nowStr
                    };

                    const newReceiverBalance = ((receiverData && receiverData.balance) ? receiverData.balance : 150000) + numericAmount;
                    const newTxReceiver = {
                        id: txId,
                        type: 'reception',
                        name: phone,
                        amount: `+ ${numericAmount.toLocaleString('fr-FR')} FCFA`,
                        date: nowStr
                    };

                    senderRef.update({ balance: newSenderBalance });
                    senderRef.child('transactions').push(newTxSender);

                    if (!receiverData) {
                        receiverRef.set({
                            pin: "1234", // Pin par défaut sécurisé pour les comptes créés de force par un transfert
                            balance: newReceiverBalance,
                            name: `Client +221 ${cleanRecipient.slice(-6)}`,
                            transactions: { [txId]: newTxReceiver }
                        });
                    } else {
                        receiverRef.update({ balance: newReceiverBalance });
                        receiverRef.child('transactions').push(newTxReceiver);
                    }

                    alert('Transfert de ' + numericAmount.toLocaleString('fr-FR') + ' FCFA réussi (0 FCFA de frais) !');
                    setRecipient('');
                    setAmount('');
                    setScreen('dashboard');
                });
            };

            const handleDeposit = (e) => {
                e.preventDefault();
                const numDeposit = Number(depositAmount);
                if (!numDeposit || numDeposit <= 0) return alert('Montant invalide.');

                const confirmPay = window.confirm(`[PayDunya ${PAYDUNYA_CONFIG.mode.toUpperCase()}] Initier le dépôt de ${numDeposit.toLocaleString('fr-FR')} FCFA via ${depositProvider} ?`);
                if (!confirmPay) return;

                const newBalance = balance + numDeposit;
                const txId = Date.now();
                const newTx = {
                    id: txId,
                    type: 'reception',
                    name: `Dépôt (${depositProvider})`,
                    amount: `+ ${numDeposit.toLocaleString('fr-FR')} FCFA`,
                    date: 'À l\'instant'
                };

                const senderRef = db.ref('users/' + phone);
                senderRef.update({ balance: newBalance });
                senderRef.child('transactions').push(newTx);

                alert(`Dépôt de ${numDeposit.toLocaleString('fr-FR')} FCFA validé avec succès !`);
                setDepositAmount('');
                setScreen('dashboard');
            };

            const handleWithdraw = (e) => {
                e.preventDefault();
                const numWithdraw = Number(withdrawAmount);
                const cleanWPhone = withdrawPhone.trim();
                if (!numWithdraw || numWithdraw <= 0) return alert('Montant de retrait invalide.');
                if (!cleanWPhone || cleanWPhone.length < 8) return alert('Numéro de retrait invalide.');
                if (numWithdraw > balance) return alert('Solde insuffisant pour ce retrait.');

                const confirmPayout = window.confirm(`[PayDunya ${PAYDUNYA_CONFIG.mode.toUpperCase()}] Lancer le versement de ${numWithdraw.toLocaleString('fr-FR')} FCFA vers ${withdrawProvider} (${cleanWPhone}) ?`);
                if (!confirmPayout) return;

                const newBalance = balance - numWithdraw;
                const txId = Date.now();
                const newTx = {
                    id: txId,
                    type: 'envoi',
                    name: `Retrait vers ${withdrawProvider} (${cleanWPhone})`,
                    amount: `- ${numWithdraw.toLocaleString('fr-FR')} FCFA`,
                    date: 'À l\'instant'
                };

                const senderRef = db.ref('users/' + phone);
                senderRef.update({ balance: newBalance });
                senderRef.child('transactions').push(newTx);

                alert(`Retrait vers ${withdrawProvider} effectué avec succès !`);
                setWithdrawAmount('');
                setWithdrawPhone('');
                setScreen('dashboard');
            };

            const handleChangePin = (e) => {
                e.preventDefault();
                if (newPinVal.length !== 4) return alert('Le nouveau code PIN doit comporter exactement 4 chiffres.');
                
                db.ref('users/' + phone).update({ pin: newPinVal }).then(() => {
                    localStorage.setItem('kaddupay_pin', newPinVal);
                    alert('Code PIN modifié avec succès !');
                    setNewPinVal('');
                    setScreen('dashboard');
                });
            };

            const logout = () => {
                localStorage.removeItem('kaddupay_phone');
                localStorage.removeItem('kaddupay_pin');
                setPhone('');
                setPin(['', '', '', '']);
                setIsNewUser(false);
                setScreen('phone');
            };

            return (
                <div className="flex flex-col h-full max-w-md mx-auto w-full bg-[#0b1329] p-5 justify-between">
                    {screen === 'phone' && (
                        <div className="flex flex-col justify-between h-full py-4">
                            <div>
                                <div className="pt-2"><KadduPayLogo className="h-14" /></div>
                                <div className="mt-12 space-y-3">
                                    <div className="inline-flex items-center space-x-2 bg-orange-500/10 border border-orange-500/20 px-3 py-1 rounded-full text-orange-400 text-xs font-semibold">
                                        ⚡ 0 Frais & Temps Réel
                                    </div>
                                    <h1 className="text-3xl font-extrabold text-white">Entrez votre numéro</h1>
                                    <p className="text-slate-400 text-sm">Accédez ou créez votre compte KàdduPay.</p>
                                </div>
                                <form onSubmit={handlePhoneSubmit} className="mt-8 space-y-4">
                                    <div className="flex items-center bg-slate-800/80 border border-slate-700 rounded-2xl p-4">
                                        <span className="text-lg pr-3 border-r border-slate-700">🇸🇳 +221</span>
                                        <input type="tel" value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="77 000 00 00" className="bg-transparent pl-3 w-full text-white focus:outline-none text-lg font-bold" required />
                                    </div>
                                    <button type="submit" className="w-full bg-gradient-to-r from-orange-600 to-amber-500 text-white font-bold py-4 rounded-2xl mt-6 shadow-lg">Continuer</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {screen === 'pin_login' && (
                        <div className="flex flex-col justify-between h-full py-4">
                            <div>
                                <button onClick={() => setScreen('phone')} className="text-slate-400 text-sm pt-2">← Retour</button>
                                <div className="mt-8 space-y-2 text-center">
                                    <div className="flex justify-center mb-4"><KadduPayLogo className="h-12" /></div>
                                    <h1 className="text-2xl font-bold text-white">
                                        {isNewUser ? "Créez votre code PIN" : "Entrez votre code secret"}
                                    </h1>
                                    <p className="text-slate-400 text-sm">
                                        {isNewUser ? "Sécurisez votre nouveau compte KàdduPay" : `+221 ${phone}`}
                                    </p>
                                </div>
                                <form onSubmit={handlePinSubmit} className="mt-8 space-y-8">
                                    <div className="flex justify-center space-x-3">
                                        {[0, 1, 2, 3].map((index) => (
                                            <input id={`pin-${index}`} key={index} type="password" inputMode="numeric" maxLength="1" value={pin[index]} onChange={(e) => handlePinInput(e.target.value, index)} className="w-16 h-16 bg-slate-800 border border-slate-700 rounded-2xl text-center text-3xl font-bold text-white focus:border-orange-500 focus:outline-none" />
                                        ))}
                                    </div>
                                    <button type="submit" className="w-full bg-gradient-to-r from-orange-600 to-amber-500 text-white font-bold py-4 rounded-2xl shadow-lg">
                                        {isNewUser ? "Valider et Créer le compte" : "Confirmer"}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {screen === 'dashboard' && (
                        <div className="flex flex-col h-full justify-between py-2 space-y-4 overflow-y-auto">
                            <div>
                                <div className="flex items-center justify-between">
                                    <KadduPayLogo className="h-10" />
                                    <div className="flex space-x-2">
                                        <button onClick={() => setScreen('profile')} className="bg-slate-800 p-2.5 rounded-xl border border-slate-700 text-orange-400 text-xs font-semibold flex items-center space-x-1">
                                            <i data-lucide="user" className="w-4 h-4"></i><span>Profil</span>
                                        </button>
                                        <button onClick={logout} className="bg-slate-800 p-2.5 rounded-xl border border-slate-700 text-slate-400 text-xs font-semibold">Quitter</button>
                                    </div>
                                </div>
                                <div className="mt-5 bg-slate-800 border border-slate-700 rounded-3xl p-6 text-center shadow-xl">
                                    <p className="text-xs font-semibold text-slate-400 uppercase">Solde disponible (+221 {phone})</p>
                                    <div className="text-4xl font-extrabold text-white mt-2">
                                        {balance.toLocaleString('fr-FR')} <span className="text-orange-400 text-xl">FCFA</span>
                                    </div>
                                    <div className="mt-4 inline-flex items-center space-x-2 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full text-emerald-400 text-xs font-semibold">
                                        ✓ PayDunya Connecté (0 Frais)
                                    </div>
                                </div>

                                <div className="grid grid-cols-4 gap-2 mt-5">
                                    <button onClick={() => setScreen('send')} className="bg-gradient-to-r from-orange-600 to-amber-500 text-white p-3 rounded-2xl font-bold flex flex-col items-center justify-center space-y-1 shadow-lg text-[11px]">
                                        <i data-lucide="send" className="w-5 h-5"></i><span>Envoyer</span>
                                    </button>
                                    <button onClick={() => setScreen('scan')} className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-3 rounded-2xl font-bold flex flex-col items-center justify-center space-y-1 shadow-lg text-[11px]">
                                        <i data-lucide="camera" className="w-5 h-5"></i><span>Scanner</span>
                                    </button>
                                    <button onClick={() => setScreen('deposit')} className="bg-slate-800 border border-slate-700 text-slate-200 p-3 rounded-2xl font-bold flex flex-col items-center justify-center space-y-1 text-[11px]">
                                        <i data-lucide="download" className="w-5 h-5 text-emerald-400"></i><span>Dépôt</span>
                                    </button>
                                    <button onClick={() => setScreen('withdraw')} className="bg-slate-800 border border-slate-700 text-slate-200 p-3 rounded-2xl font-bold flex flex-col items-center justify-center space-y-1 text-[11px]">
                                        <i data-lucide="upload" className="w-5 h-5 text-orange-400"></i><span>Retrait</span>
                                    </button>
                                </div>

                                <div className="mt-6 space-y-3">
                                    <h3 className="text-sm font-bold uppercase text-slate-400">Historique récent</h3>
                                    <div className="space-y-3">
                                        {transactions.map(tx => (
                                            <div key={tx.id} className="bg-slate-800/50 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
                                                <div>
                                                    <p className="font-semibold text-sm text-white">{tx.name}</p>
                                                    <p className="text-xs text-slate-500">{tx.date}</p>
                                                </div>
                                                <span className={`font-bold text-sm ${tx.type === 'reception' ? 'text-emerald-400' : 'text-slate-200'}`}>
                                                    {tx.amount}
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {screen === 'scan' && (
                        <div className="flex flex-col justify-between h-full py-2">
                            <div>
                                <button onClick={() => setScreen('dashboard')} className="text-slate-400 text-sm pt-2">← Annuler</button>
                                <div className="mt-4 text-center space-y-2">
                                    <h1 className="text-2xl font-bold text-white">Scanner un QR Code</h1>
                                    <p className="text-slate-400 text-sm">Alignez le QR code dans le cadre</p>
                                </div>
                                <div className="mt-6 bg-slate-800 border border-slate-700 rounded-3xl p-4 overflow-hidden shadow-2xl flex justify-center items-center min-h-[280px]">
                                    <div id="reader" className="w-full rounded-2xl overflow-hidden"></div>
                                </div>
                            </div>
                        </div>
                    )}

                    {screen === 'profile' && (
                        <div className="flex flex-col justify-between h-full py-2 overflow-y-auto">
                            <div>
                                <button onClick={() => setScreen('dashboard')} className="text-slate-400 text-sm pt-2">← Retour</button>
                                <div className="mt-4 text-center space-y-2">
                                    <div className="w-20 h-20 bg-gradient-to-tr from-orange-600 to-amber-500 rounded-full mx-auto flex items-center text-2xl font-extrabold justify-center text-white shadow-xl">
                                        {phone.slice(-2)}
                                    </div>
                                    <h1 className="text-2xl font-bold text-white">{userName}</h1>
                                    <p className="text-slate-400 text-sm">🇸🇳 +221 {phone}</p>
                                    <div className="inline-flex items-center space-x-1.5 bg-blue-500/10 border border-blue-500/20 px-3 py-1 rounded-full text-blue-400 text-xs font-semibold">
                                        <span>✓ Compte Vérifié (KYC Sénégal)</span>
                                    </div>
                                </div>

                                <div className="mt-6 bg-slate-800 border border-slate-700 rounded-3xl p-6 text-center space-y-4">
                                    <p className="text-xs font-bold text-slate-400 uppercase">Mon QR Code de Réception</p>
                                    <div className="bg-white p-4 rounded-2xl w-48 h-48 mx-auto flex flex-col items-center justify-center shadow-lg">
                                        <DynamicQRCode value={`kaddupay:+221${phone}`} />
                                    </div>
                                    <p className="text-xs text-slate-400">Faites scanner ce code pour recevoir de l'argent instantanément.</p>
                                </div>

                                <div className="mt-4">
                                    <button onClick={() => setScreen('settings')} className="w-full bg-slate-800 border border-slate-700 text-slate-200 font-bold py-3.5 rounded-2xl flex items-center justify-center space-x-2">
                                        <i data-lucide="shield" className="w-5 h-5 text-orange-400"></i><span>Modifier le code PIN</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {screen === 'settings' && (
                        <div className="flex flex-col justify-between h-full py-2">
                            <div>
                                <button onClick={() => setScreen('profile')} className="text-slate-400 text-sm pt-2">← Retour</button>
                                <div className="mt-6 space-y-2">
                                    <h1 className="text-2xl font-bold text-white">Sécurité du compte</h1>
                                    <p className="text-slate-400 text-sm">Modifiez votre code PIN secret à 4 chiffres.</p>
                                </div>
                                <form onSubmit={handleChangePin} className="mt-6 space-y-4">
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-semibold text-slate-300 uppercase">Nouveau Code PIN (4 chiffres)</label>
                                        <input type="password" inputMode="numeric" maxLength="4" value={newPinVal} onChange={(e) => setNewPinVal(e.target.value)} placeholder="••••" className="bg-slate-800 border border-slate-700 rounded-2xl p-3.5 w-full text-2xl font-bold tracking-widest text-white focus:outline-none" required />
                                    </div>
                                    <button type="submit" className="w-full bg-gradient-to-r from-orange-600 to-amber-500 text-white font-bold py-4 rounded-2xl mt-4 shadow-lg">Mettre à jour le PIN</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {screen === 'deposit' && (
                        <div className="flex flex-col justify-between h-full py-2">
                            <div>
                                <button onClick={() => setScreen('dashboard')} className="text-slate-400 text-sm pt-2">← Retour</button>
                                <div className="mt-6 space-y-2">
                                    <h1 className="text-2xl font-bold text-white">Dépôt (PayDunya)</h1>
                                    <p className="text-slate-400 text-sm">Alimentez votre solde depuis Mobile Money</p>
                                </div>
                                <form onSubmit={handleDeposit} className="mt-6 space-y-4">
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-semibold text-slate-300 uppercase">Choisir l'opérateur</label>
                                        <div className="grid grid-cols-2 gap-3">
                                            <button type="button" onClick={() => setDepositProvider('Orange Money')} className={`p-3.5 rounded-2xl border font-bold text-sm ${depositProvider === 'Orange Money' ? 'bg-orange-500/20 border-orange-500 text-orange-400' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                                Orange Money
                                            </button>
                                            <button type="button" onClick={() => setDepositProvider('Free Money')} className={`p-3.5 rounded-2xl border font-bold text-sm ${depositProvider === 'Free Money' ? 'bg-purple-500/20 border-purple-500 text-purple-400' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                                Free Money
                                            </button>
                                        </div>
                                    </div>
                                    <div className="space-y-1.5 pt-2">
                                        <label className="text-xs font-semibold text-slate-300 uppercase">Montant (FCFA)</label>
                                        <input type="number" value={depositAmount} onChange={(e) => setDepositAmount(e.target.value)} placeholder="10000" className="bg-slate-800 border border-slate-700 rounded-2xl p-3.5 w-full text-2xl font-bold text-white focus:outline-none" required />
                                    </div>
                                    <button type="submit" className="w-full bg-gradient-to-r from-emerald-600 to-teal-500 text-white font-bold py-4 rounded-2xl mt-4 shadow-lg">Lancer le paiement</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {screen === 'withdraw' && (
                        <div className="flex flex-col justify-between h-full py-2">
                            <div>
                                <button onClick={() => setScreen('dashboard')} className="text-slate-400 text-sm pt-2">← Retour</button>
                                <div className="mt-6 space-y-2">
                                    <h1 className="text-2xl font-bold text-white">Retrait (Payout)</h1>
                                    <p className="text-slate-400 text-sm">Transférez vers votre Mobile Money</p>
                                </div>
                                <form onSubmit={handleWithdraw} className="mt-6 space-y-4">
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-semibold text-slate-300 uppercase">Choisir l'opérateur</label>
                                        <div className="grid grid-cols-2 gap-3">
                                            <button type="button" onClick={() => setWithdrawProvider('Orange Money')} className={`p-3.5 rounded-2xl border font-bold text-sm ${withdrawProvider === 'Orange Money' ? 'bg-orange-500/20 border-orange-500 text-orange-400' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                                Orange Money
                                            </button>
                                            <button type="button" onClick={() => setWithdrawProvider('Free Money')} className={`p-3.5 rounded-2xl border font-bold text-sm ${withdrawProvider === 'Free Money' ? 'bg-purple-500/20 border-purple-500 text-purple-400' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                                                Free Money
                                            </button>
                                        </div>
                                    </div>
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-semibold text-slate-300 uppercase">Numéro de téléphone</label>
                                        <input type="tel" value={withdrawPhone} onChange={(e) => setWithdrawPhone(e.target.value)} placeholder="77 000 00 00" className="bg-slate-800 border border-slate-700 rounded-2xl p-3.5 w-full text-white focus:outline-none" required />
                                    </div>
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-semibold text-slate-300 uppercase">Montant du retrait (FCFA)</label>
                                        <input type="number" value={withdrawAmount} onChange={(e) => setWithdrawAmount(e.target.value)} className="bg-slate-800 border border-slate-700 rounded-2xl p-3.5 w-full text-2xl font-bold text-white focus:outline-none" placeholder="0" required />
                                    </div>
                                    <button type="submit" className="w-full bg-gradient-to-r from-orange-600 to-amber-500 text-white font-bold py-4 rounded-2xl mt-4 shadow-lg">Confirmer le versement</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {screen === 'send' && (
                        <div className="flex flex-col justify-between h-full py-2">
                            <div>
                                <button onClick={() => setScreen('dashboard')} className="text-slate-400 text-sm pt-2">← Retour</button>
                                <div className="mt-6 space-y-2">
                                    <h1 className="text-2xl font-bold text-white">Envoyer de l'argent</h1>
                                    <p className="text-slate-400 text-sm">Frais de transfert : 0 FCFA</p>
                                </div>
                                <form onSubmit={handleSendMoney} className="mt-6 space-y-4">
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-semibold text-slate-300 uppercase">Numéro destinataire</label>
                                        <input type="tel" value={recipient} onChange={(e) => setRecipient(e.target.value)} placeholder="786303976" className="bg-slate-800 border border-slate-700 rounded-2xl p-3.5 w-full text-white focus:outline-none text-lg font-bold" required />
                                    </div>
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-semibold text-slate-300 uppercase">Montant (FCFA)</label>
                                        <input type="number" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0" className="bg-slate-800 border border-slate-700 rounded-2xl p-3.5 w-full text-2xl font-bold text-white focus:outline-none" required />
                                    </div>
                                    <button type="submit" className="w-full bg-gradient-to-r from-orange-600 to-amber-500 text-white font-bold py-4 rounded-2xl mt-4 shadow-lg">Transférer instantanément</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
