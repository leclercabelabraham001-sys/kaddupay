<!DOCTYPE html>
<html lang="fr" class="h-full bg-[#0b1329]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KàdduPay - Le Transfert d'Argent 100% Gratuit</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b1329">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html, body, #root {
      width: 100%;
      min-height: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0b1329;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    .safe-top { padding-top: env(safe-area-inset-top, 20px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 20px); }
  </style>
</head>
<body class="bg-[#0b1329] text-white">
  <div id="root" class="w-full min-h-screen"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Icon = ({ name, size = 24, className = "" }) => {
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [name]);
      return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
    };

    function App() {
      const [step, setStep] = useState(1);
      const [activeTab, setActiveTab] = useState('home');
      const [phone, setPhone] = useState('');
      const [email, setEmail] = useState('');
      const [otp, setOtp] = useState(['', '', '', '']);
      const [balance, setBalance] = useState(125000);
      const [showTransferModal, setShowTransferModal] = useState(false);
      const [showBargainModal, setShowBargainModal] = useState(false);
      const [recipient, setRecipient] = useState('');
      const [amount, setAmount] = useState('');
      const [bargainAmount, setBargainAmount] = useState('');
      const [bargainOffer, setBargainOffer] = useState('');
      const [tontineSavings, setTontineSavings] = useState(15000);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [step, activeTab, showTransferModal, showBargainModal]);

      const handleOtpChange = (index, value) => {
        if (value.length > 1) return;
        const newOtp = [...otp];
        newOtp[index] = value;
        setOtp(newOtp);
        if (value && index < 3) {
          const nextInput = document.getElementById(`otp-${index + 1}`);
          if (nextInput) nextInput.focus();
        }
      };

      const handleTransfer = (e) => {
        e.preventDefault();
        const numAmount = Number(amount);
        if (numAmount > 0 && numAmount <= balance) {
          setBalance(prev => prev - numAmount);
          setShowTransferModal(false);
          setAmount('');
          setRecipient('');
          alert(`Transfert de ${numAmount.toLocaleString()} FCFA réussi à 0 FCFA de frais !`);
        } else {
          alert("Solde insuffisant ou montant invalide.");
        }
      };

      if (step < 4) {
        return (
          <div className="w-full min-h-screen flex flex-col justify-between p-6 bg-[#0b1329] safe-top safe-bottom">
            <div>
              <div className="flex justify-between items-center mb-8 pt-2">
                <div className="flex items-center gap-3">
                  <div className="w-11 h-11 bg-orange-600 rounded-2xl flex items-center justify-center font-bold text-white text-xl shadow-lg shadow-orange-600/30">
                    K
                  </div>
                  <span className="font-extrabold text-2xl tracking-wide text-white">KàdduPay</span>
                </div>
                <span className="text-xs bg-slate-800/80 text-orange-400 px-3.5 py-1.5 rounded-full font-semibold border border-orange-500/20">
                  Étape {step} sur 3
                </span>
              </div>

              <div className="w-full bg-slate-800/80 h-2 rounded-full mb-8 overflow-hidden">
                <div className="bg-gradient-to-r from-orange-600 to-orange-400 h-full transition-all duration-500" style={{ width: `${(step / 3) * 100}%` }}></div>
              </div>

              {step === 1 && (
                <div className="space-y-6">
                  <div>
                    <span className="text-xs font-semibold text-orange-400 bg-orange-500/10 px-3 py-1 rounded-full border border-orange-500/20 inline-block mb-3">
                      ⚡ Inscription instantanée
                    </span>
                    <h1 className="text-3xl font-extrabold text-white leading-tight mb-2">
                      Le transfert d'argent 100% gratuit au Sénégal.
                    </h1>
                    <p className="text-slate-400 text-sm">
                      Zéro frais sur tous vos transferts d'argent. Entrez votre numéro pour commencer.
                    </p>
                  </div>

                  <div className="space-y-4 pt-2">
                    <div>
                      <label className="text-xs font-semibold text-slate-300 mb-1.5 block">Numéro de Téléphone</label>
                      <div className="flex gap-2">
                        <div className="bg-slate-800/90 border border-slate-700/80 rounded-xl px-3.5 py-3.5 flex items-center gap-2 text-sm text-slate-200">
                          <span>🇸🇳</span>
                          <span className="font-semibold">+221</span>
                        </div>
                        <input 
                          type="tel" 
                          placeholder="77 000 00 00"
                          value={phone}
                          onChange={(e) => setPhone(e.target.value)}
                          className="flex-1 bg-slate-800/90 border border-slate-700/80 rounded-xl px-4 py-3.5 text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 font-medium text-base"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="text-xs font-semibold text-slate-300 mb-1.5 block">Email (Optionnel)</label>
                      <input 
                        type="email" 
                        placeholder="exemple@domain.sn"
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        className="w-full bg-slate-800/90 border border-slate-700/80 rounded-xl px-4 py-3.5 text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 text-base"
                      />
                    </div>
                  </div>
                </div>
              )}

              {step === 2 && (
                <div className="space-y-6">
                  <div>
                    <span className="text-xs font-semibold text-orange-400 bg-orange-500/10 px-3 py-1 rounded-full border border-orange-500/20 inline-block mb-3">
                      🔒 Sécurité SMS
                    </span>
                    <h1 className="text-3xl font-extrabold text-white leading-tight mb-2">
                      Vérification du numéro
                    </h1>
                    <p className="text-slate-400 text-sm">
                      Un code à 4 chiffres a été envoyé au <span className="text-white font-semibold">+221 {phone || '77 000 00 00'}</span>.
                    </p>
                  </div>

                  <div className="flex justify-between gap-3 pt-6">
                    {otp.map((digit, idx) => (
                      <input
                        key={idx}
                        id={`otp-${idx}`}
                        type="text"
                        maxLength="1"
                        value={digit}
                        onChange={(e) => handleOtpChange(idx, e.target.value)}
                        className="w-16 h-16 bg-slate-800/90 border border-slate-700/80 rounded-2xl text-center text-2xl font-bold text-white focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20"
                      />
                    ))}
                  </div>

                  <div className="text-center pt-4">
                    <button onClick={() => alert("Nouveau code envoyé !")} className="text-xs text-orange-400 font-semibold hover:underline">
                      Renvoyer le code par SMS
                    </button>
                  </div>
                </div>
              )}

              {step === 3 && (
                <div className="space-y-6">
                  <div>
                    <span className="text-xs font-semibold text-orange-400 bg-orange-500/10 px-3 py-1 rounded-full border border-orange-500/20 inline-block mb-3">
                      👤 Configuration du profil
                    </span>
                    <h1 className="text-3xl font-extrabold text-white leading-tight mb-2">
                      Finalisez votre compte
                    </h1>
                    <p className="text-slate-400 text-sm">
                      Choisissez le type de compte pour commencer à effectuer vos transactions.
                    </p>
                  </div>

                  <div className="grid grid-cols-1 gap-4 pt-2">
                    <div className="bg-slate-800/90 border-2 border-orange-500 p-5 rounded-2xl flex items-center justify-between cursor-pointer">
                      <div className="flex items-center gap-4">
                        <div className="w-12 h-12 bg-orange-500/20 rounded-xl flex items-center justify-center text-orange-400">
                          <Icon name="user" size={24} />
                        </div>
                        <div>
                          <h4 className="font-bold text-white">Compte Particulier</h4>
                          <p className="text-xs text-slate-400">Transferts 0 FCFA, Tontines & Achats</p>
                        </div>
                      </div>
                      <div className="w-6 h-6 rounded-full bg-orange-500 flex items-center justify-center text-white text-xs font-bold">✓</div>
                    </div>

                    <div className="bg-slate-800/50 border border-slate-700 p-5 rounded-2xl flex items-center justify-between opacity-70">
                      <div className="flex items-center gap-4">
                        <div className="w-12 h-12 bg-slate-700/50 rounded-xl flex items-center justify-center text-slate-300">
                          <Icon name="store" size={24} />
                        </div>
                        <div>
                          <h4 className="font-bold text-white">Compte Marchand</h4>
                          <p className="text-xs text-slate-400">Frais à 0.5% & Kàddu Bargaining</p>
                        </div>
                      </div>
                      <div className="w-6 h-6 rounded-full border border-slate-600"></div>
                    </div>
                  </div>
                </div>
              )}
            </div>

            <div className="pt-6">
              <button
                onClick={() => setStep(step + 1)}
                className="w-full bg-gradient-to-r from-orange-600 to-orange-500 hover:from-orange-500 hover:to-orange-400 text-white font-bold py-4 rounded-xl shadow-lg shadow-orange-600/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-base"
              >
                <span>{step === 3 ? "Ouvrir mon compte" : "Continuer"}</span>
                <Icon name="chevron-right" size={20} />
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="w-full min-h-screen bg-[#0b1329] pb-24 flex flex-col justify-between safe-top">
          <div className="px-6 pt-4 pb-2 flex justify-between items-center">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 bg-orange-600 rounded-xl flex items-center justify-center font-bold text-white text-lg shadow-md shadow-orange-600/20">
                K
              </div>
              <div>
                <span className="text-xs text-slate-400 block">Bienvenue 👋</span>
                <span className="font-bold text-white text-sm">Abel Leclerc</span>
              </div>
            </div>
            <div className="flex items-center gap-3">
              <button className="w-10 h-10 bg-slate-800/80 rounded-xl flex items-center justify-center text-slate-300 border border-slate-700/50 relative">
                <Icon name="bell" size={20} />
                <span className="absolute top-2 right-2 w-2 h-2 bg-orange-500 rounded-full"></span>
              </button>
            </div>
          </div>

          <div className="px-6 space-y-6 pt-2">
            <div className="bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700/80 rounded-3xl p-6 shadow-xl relative overflow-hidden">
              <div className="absolute top-0 right-0 w-32 h-32 bg-orange-500/10 rounded-full blur-2xl pointer-events-none"></div>
              <div className="flex justify-between items-center mb-2">
                <span className="text-xs font-medium text-slate-400">Solde Disponible</span>
                <span className="text-xs font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">
                  Transferts 0 FCFA
                </span>
              </div>

              <div className="text-3xl font-extrabold text-white tracking-tight mb-6">
                {balance.toLocaleString()} <span className="text-sm font-semibold text-orange-400">FCFA</span>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <button onClick={() => setShowTransferModal(true)} className="bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 text-sm shadow-md shadow-orange-600/20 active:scale-95 transition-all">
                  <Icon name="arrow-up-right" size={18} />
                  <span>Envoyer</span>
                </button>
                <button onClick={() => alert("Votre QR Code KàdduPay est prêt à être scanné.")} className="bg-slate-700/80 hover:bg-slate-700 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 text-sm active:scale-95 transition-all">
                  <Icon name="qr-code" size={18} />
                  <span>Recevoir</span>
                </button>
              </div>
            </div>

            <div>
              <h3 className="text-sm font-bold text-slate-300 mb-3">Innovations Kàddu</h3>
              <div className="grid grid-cols-3 gap-3">
                <button onClick={() => setShowBargainModal(true)} className="bg-slate-800/90 border border-slate-700/70 p-4 rounded-2xl flex flex-col items-center text-center gap-2 hover:border-orange-500/50 transition-all">
                  <div className="w-10 h-10 bg-amber-500/10 text-amber-400 rounded-xl flex items-center justify-center">
                    <Icon name="handshake" size={20} />
                  </div>
                  <span className="text-xs font-semibold text-slate-200">Bargaining</span>
                </button>

                <button onClick={() => alert(`Solde Tontine Digitale: ${tontineSavings.toLocaleString()} FCFA`)} className="bg-slate-800/90 border border-slate-700/70 p-4 rounded-2xl flex flex-col items-center text-center gap-2 hover:border-orange-500/50 transition-all">
                  <div className="w-10 h-10 bg-emerald-500/10 text-emerald-400 rounded-xl flex items-center justify-center">
                    <Icon name="piggy-bank" size={20} />
                  </div>
                  <span className="text-xs font-semibold text-slate-200">Tontine</span>
                </button>

                <button onClick={() => alert("Recharge Téléphone / Pass Internet sans frais.")} className="bg-slate-800/90 border border-slate-700/70 p-4 rounded-2xl flex flex-col items-center text-center gap-2 hover:border-orange-500/50 transition-all">
                  <div className="w-10 h-10 bg-blue-500/10 text-blue-400 rounded-xl flex items-center justify-center">
                    <Icon name="smartphone" size={20} />
                  </div>
                  <span className="text-xs font-semibold text-slate-200">Crédit / Pass</span>
                </button>
              </div>
            </div>

            <div>
              <div className="flex justify-between items-center mb-3">
                <h3 className="text-sm font-bold text-slate-300">Dernières Transactions</h3>
                <span className="text-xs text-orange-400 font-semibold cursor-pointer">Voir tout</span>
              </div>

              <div className="space-y-2.5">
                <div className="bg-slate-800/60 border border-slate-700/50 p-3.5 rounded-2xl flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 bg-emerald-500/10 text-emerald-400 rounded-xl flex items-center justify-center font-bold">
                      <Icon name="arrow-down-left" size={20} />
                    </div>
                    <div>
                      <h4 className="text-sm font-bold text-white">Moussa Diop</h4>
                      <p className="text-xs text-slate-400">Transfert reçu • Aujourd'hui</p>
                    </div>
                  </div>
                  <span className="text-sm font-extrabold text-emerald-400">+25,000 F</span>
                </div>

                <div className="bg-slate-800/60 border border-slate-700/50 p-3.5 rounded-2xl flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 bg-slate-700/50 text-slate-300 rounded-xl flex items-center justify-center font-bold">
                      <Icon name="shopping-bag" size={20} />
                    </div>
                    <div>
                      <h4 className="text-sm font-bold text-white">Boutique Auchan Almadies</h4>
                      <p className="text-xs text-slate-400">Paiement Marchand • Hier</p>
                    </div>
                  </div>
                  <span className="text-sm font-extrabold text-white">-12,400 F</span>
                </div>
              </div>
            </div>
          </div>

          <div className="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-6 py-3 flex justify-around items-center safe-bottom z-40">
            <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center gap-1 ${activeTab === 'home' ? 'text-orange-500' : 'text-slate-400'}`}>
              <Icon name="home" size={22} />
              <span className="text-[10px] font-bold">Accueil</span>
            </button>
            <button onClick={() => setActiveTab('history')} className={`flex flex-col items-center gap-1 ${activeTab === 'history' ? 'text-orange-500' : 'text-slate-400'}`}>
              <Icon name="history" size={22} />
              <span className="text-[10px] font-bold">Activité</span>
            </button>
            <button onClick={() => setShowTransferModal(true)} className="w-12 h-12 bg-orange-600 text-white rounded-full flex items-center justify-center -mt-5 shadow-lg shadow-orange-600/40">
              <Icon name="arrow-up-right" size={24} />
            </button>
            <button onClick={() => setActiveTab('tontine')} className={`flex flex-col items-center gap-1 ${activeTab === 'tontine' ? 'text-orange-500' : 'text-slate-400'}`}>
              <Icon name="piggy-bank" size={22} />
              <span className="text-[10px] font-bold">Tontine</span>
            </button>
            <button onClick={() => setActiveTab('profile')} className={`flex flex-col items-center gap-1 ${activeTab === 'profile' ? 'text-orange-500' : 'text-slate-400'}`}>
              <Icon name="user" size={22} />
              <span className="text-[10px] font-bold">Profil</span>
            </button>
          </div>

          {showTransferModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end justify-center">
              <div className="bg-slate-900 border-t border-slate-800 w-full rounded-t-3xl p-6 space-y-4 animate-in slide-in-from-bottom duration-300 safe-bottom">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-bold text-white">Nouveau Transfert (0 FCFA)</h3>
                  <button onClick={() => setShowTransferModal(false)} className="text-slate-400 font-bold p-1">✕</button>
                </div>
                <form onSubmit={handleTransfer} className="space-y-4 pt-2">
                  <div>
                    <label className="text-xs font-semibold text-slate-300 mb-1 block">Destinataire</label>
                    <input type="tel" placeholder="77 / 78 / 76 / 70 XXX XX XX" value={recipient} onChange={(e) => setRecipient(e.target.value)} required className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 text-base" />
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-300 mb-1 block">Montant (FCFA)</label>
                    <input type="number" placeholder="Ex: 5000" value={amount} onChange={(e) => setAmount(e.target.value)} required className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 text-base" />
                  </div>
                  <div className="bg-orange-500/10 border border-orange-500/20 p-3 rounded-xl flex justify-between items-center text-xs text-orange-400 font-semibold">
                    <span>Frais de transfert</span>
                    <span className="text-sm font-bold">0 FCFA</span>
                  </div>
                  <button type="submit" className="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-orange-600/30">
                    Confirmer l'envoi
                  </button>
                </form>
              </div>
            </div>
          )}

          {showBargainModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end justify-center">
              <div className="bg-slate-900 border-t border-slate-800 w-full rounded-t-3xl p-6 space-y-4 animate-in slide-in-from-bottom duration-300 safe-bottom">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-bold text-white">Kàddu Bargaining (Paiement)</h3>
                  <button onClick={() => setShowBargainModal(false)} className="text-slate-400 font-bold p-1">✕</button>
                </div>
                <p className="text-xs text-slate-400">Proposez directement une remise au marchand pour valider votre achat.</p>
                <div className="space-y-3 pt-2">
                  <input type="number" placeholder="Prix affiché par le marchand (FCFA)" value={bargainAmount} onChange={(e) => setBargainAmount(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 text-base" />
                  <input type="number" placeholder="Votre offre / Prix négocié (FCFA)" value={bargainOffer} onChange={(e) => setBargainOffer(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 text-base" />
                  <button onClick={() => { alert(`Offre de ${bargainOffer} FCFA envoyée au marchand !`); setShowBargainModal(false); }} className="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-amber-600/30">
                    Envoyer l'offre au Marchand
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
