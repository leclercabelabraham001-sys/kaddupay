<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KàdduPay - Paiement Mobile Sans Frais au Sénégal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b1329;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            height: 100vh;
            height: 100dvh;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="h-full">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDqqIU5pOJtYJsMW5cvPPg3kTa0IAUsXhQ",
            authDomain: "kaadupay.firebaseapp.com",
            databaseURL: "https://kaadupay-default-rtdb.firebaseio.com",
            projectId: "kaadupay",
            storageBucket: "kaadupay.firebasestorage.app",
            messagingSenderId: "996765843976",
            appId: "1:996765843976:web:fa4312ffef199add3007bd",
            measurementId: "G-SWYYHXPXR5"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const KadduPayLogo = ({ className = "h-12" }) => (
            <div className={`flex items-center space-x-3 ${className}`}>
                <svg viewBox="0 0 100 110" className="h-full w-auto flex-shrink-0 drop-shadow-md" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 10H42V100H15Z" fill="#C27838" />
                    <path d="M20 15H37V95H20Z" fill="#1E293B" />
                    <path d="M42 55L78 10H100L58 60L100 100H76L42 58V55Z" fill="#C27838" />
                    <path d="M42 50L75 15H88L55 52Z" fill="#1E3A8A" />
                    <path d="M52 56L85 95H72L42 60Z" fill="#1E3A8A" />
                    <path d="M68 22C68 22 75 18 82 24C86 27 84 32 80 34C75 36 70 32 68 22Z" fill="#F97316" />
                    <circle cx="76" cy="25" r="2.5" fill="#FFFFFF" />
                    <polygon points="82,26 90,28 83,31" fill="#F97316" />
                </svg>
                <div className="flex flex-col justify-center leading-none">
                    <span className="font-extrabold text-2xl tracking-tight text-[#F97316]">Kàddu</span>
                    <span className="font-extrabold text-2xl tracking-tight text-[#1E3A8A] mt-0.5">Pay</span>
                </div>
            </div>
        );

        function App() {
            const [screen, setScreen] = useState('phone');
            const [phone, setPhone] = useState('');
            const [pin, setPin] = useState(['', '', '', '']);
            
            const [balance, setBalance] = useState(150000);
            const [recipient, setRecipient] = useState('');
            const [amount, setAmount] = useState('');
            const [transactions, setTransactions] = useState([]);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();

                const savedPhone = localStorage.getItem('kaddupay_phone');
                const savedPin = localStorage.getItem('kaddupay_pin');

                if (savedPhone && savedPin) {
                    setPhone(savedPhone);
                    setScreen('pin_login');

                    db.ref('users/' + savedPhone).on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            setBalance(data.balance ?? 150000);
                            setTransactions(data.transactions ? Object.values(data.transactions) : []);
                        }
                    });
                }
            }, []);

            const handlePhoneSubmit = (e) => {
                e.preventDefault();
                const cleanPhone = phone.trim();
                if (!cleanPhone || cleanPhone.length < 8) return alert('Veuillez entrer un numéro valide.');
                
                db.ref('users/' + cleanPhone).once('value', (snapshot) => {
                    const userData = snapshot.val();
                    if (userData && userData.pin) {
                        setScreen('pin_login');
                    } else {
                        setScreen('pin_setup');
                    }
                });
            };

            const handlePinSubmit = (e) => {
                e.preventDefault();
                const fullPin = pin.join('');
                if (fullPin.length < 4) return alert('Saisissez un code à 4 chiffres.');

                const cleanPhone = phone.trim();

                if (screen === 'pin_setup') {
                    const initialData = {
                        pin: fullPin,
                        balance: 150000,
                        transactions: {
                            1: { id: 1, type: 'reception', name: 'KàdduPay Bonus', amount: '+ 150 000 FCFA', date: 'Bienvenue' }
                        }
                    };
                    db.ref('users/' + cleanPhone).set(initialData).then(() => {
                        localStorage.setItem('kaddupay_phone', cleanPhone);
                        localStorage.setItem('kaddupay_pin', fullPin);
                        setScreen('dashboard');
                    });
                } else if (screen === 'pin_login') {
                    db.ref('users/' + cleanPhone + '/pin').once('value', (snapshot) => {
                        const correctPin = snapshot.val();
                        if (!correctPin || fullPin === correctPin) {
                            localStorage.setItem('kaddupay_phone', cleanPhone);
                            localStorage.setItem('kaddupay_pin', fullPin);
                            setScreen('dashboard');
                        } else {
                            alert('Code secret incorrect.');
                            setPin(['', '', '', '']);
                        }
                    });
                }
            };

            const handlePinInput = (val, index) => {
                const newPin = [...pin];
                newPin[index] = val;
                setPin(newPin);
                if (val && index < 3) {
                    document.getElementById(`pin-${index + 1}`)?.focus();
                }
            };

            const handleSendMoney = (e) => {
                e.preventDefault();
                const numericAmount = Number(amount);
                const cleanRecipient = recipient.trim();
                if (!cleanRecipient || !numericAmount || numericAmount <= 0) {
                    return alert('Remplissez tous les champs correctement.');
                }
                if (numericAmount > balance) {
                    return alert('Solde insuffisant.');
                }

                const senderRef = db.ref('users/' + phone);
                const receiverRef = db.ref('users/' + cleanRecipient);

                receiverRef.once('value', (snapshot) => {
                    const receiverData = snapshot.val();
                    if (!receiverData) {
                        return alert('Le numéro destinataire ' + cleanRecipient + ' n\'existe pas encore sur KàdduPay. Il doit se connecter une première fois.');
                    }

                    const txId = Date.now();
                    const nowStr = 'À l\'instant';

                    const newSenderBalance = balance - numericAmount;
                    const newTxSender = {
                        id: txId,
                        type: 'envoi',
                        name: cleanRecipient,
                        amount: `- ${numericAmount.toLocaleString('fr-FR')} FCFA`,
                        date: nowStr
                    };

                    const newReceiverBalance = (receiverData.balance || 0) + numericAmount;
                    const newTxReceiver = {
                        id: txId,
                        type: 'reception',
                        name: phone,
                        amount: `+ ${numericAmount.toLocaleString('fr-FR')} FCFA`,
                        date: nowStr
                    };

                    senderRef.update({ balance: newSenderBalance });
                    senderRef.child('transactions').push(newTxSender);

                    receiverRef.update({ balance: newReceiverBalance });
                    receiverRef.child('transactions').push(newTxReceiver);

                    alert('Transfert de ' + numericAmount.toLocaleString('fr-FR') + ' FCFA réussi avec 0 FCFA de frais !');
                    setRecipient('');
                    setAmount('');
                    setScreen('dashboard');
                });
            };

            const logout = () => {
                localStorage.clear();
                setPhone('');
                setPin(['', '', '', '']);
                setScreen('phone');
            };

            return (
                <div className="flex flex-col h-full max-w-md mx-auto w-full bg-[#0b1329] p-5 justify-between">
                    {screen === 'phone' && (
                        <div className="flex flex-col justify-between h-full py-4">
                            <div>
                                <div className="pt-2"><KadduPayLogo className="h-14" /></div>
                                <div className="mt-12 space-y-3">
                                    <div className="inline-flex items-center space-x-2 bg-orange-500/10 border border-orange-500/20 px-3 py-1 rounded-full text-orange-400 text-xs font-semibold">
                                        ⚡ Temps Réel & 0 Frais
                                    </div>
                                    <h1 className="text-3xl font-extrabold text-white">Entrez votre numéro</h1>
                                    <p className="text-slate-400 text-sm">Connectez-vous pour accéder à votre compte.</p>
                                </div>
                                <form onSubmit={handlePhoneSubmit} className="mt-8 space-y-4">
                                    <div className="flex items-center bg-slate-800/80 border border-slate-700 rounded-2xl p-4">
                                        <span className="text-lg pr-3 border-r border-slate-700">🇸🇳 +221</span>
                                        <input type="tel" value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="77 000 00 00" className="bg-transparent pl-3 w-full text-white focus:outline-none text-lg font-bold" required />
                                    </div>
                                    <button type="submit" className="w-full bg-gradient-to-r from-orange-600 to-amber-500 text-white font-bold py-4 rounded-2xl mt-6 shadow-lg">Continuer</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {(screen === 'pin_setup' || screen === 'pin_login') && (
                        <div className="flex flex-col justify-between h-full py-4">
                            <div>
                                <button onClick={() => setScreen('phone')} className="text-slate-400 text-sm pt-2">← Retour</button>
                                <div className="mt-8 space-y-2 text-center">
                                    <div className="flex justify-center mb-4"><KadduPayLogo className="h-12" /></div>
                                    <h1 className="text-2xl font-bold text-white">{screen === 'pin_setup' ? 'Créer votre code secret' : 'Entrez votre code'}</h1>
                                    <p className="text-slate-400 text-sm">+221 {phone}</p>
                                </div>
                                <form onSubmit={handlePinSubmit} className="mt-8 space-y-8">
                                    <div className="flex justify-center space-x-3">
                                        {[0, 1, 2, 3].map((index) => (
                                            <input id={`pin-${index}`} key={index} type="password" maxLength="1" value={pin[index]} onChange={(e) => handlePinInput(e.target.value, index)} className="w-16 h-16 bg-slate-800 border border-slate-700 rounded-2xl text-center text-3xl font-bold text-white focus:border-orange-500 focus:outline-none" />
                                        ))}
                                    </div>
                                    <button type="submit" className="w-full bg-gradient-to-r from-orange-600 to-amber-500 text-white font-bold py-4 rounded-2xl shadow-lg">Confirmer</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {screen === 'dashboard' && (
                        <div className="flex flex-col h-full justify-between py-2 space-y-6 overflow-y-auto">
                            <div>
                                <div className="flex items-center justify-between">
                                    <KadduPayLogo className="h-10" />
                                    <button onClick={logout} className="bg-slate-800 p-2.5 rounded-xl border border-slate-700 text-slate-400 text-xs font-semibold">Quitter</button>
                                </div>
                                <div className="mt-6 bg-slate-800 border border-slate-700 rounded-3xl p-6 text-center shadow-xl">
                                    <p className="text-xs font-semibold text-slate-400 uppercase">Solde (+221 {phone})</p>
                                    <div className="text-4xl font-extrabold text-white mt-2">
                                        {balance.toLocaleString('fr-FR')} <span className="text-orange-400 text-xl">FCFA</span>
                                    </div>
                                    <div className="mt-4 inline-flex items-center space-x-2 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full text-emerald-400 text-xs font-semibold">
                                        ✓ Synchro Cloud en direct
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-4 mt-6">
                                    <button onClick={() => setScreen('send')} className="bg-gradient-to-r from-orange-600 to-amber-500 text-white p-4 rounded-2xl font-bold flex flex-col items-center justify-center space-y-2">
                                        <i data-lucide="send" className="w-6 h-6"></i><span>Envoyer</span>
                                    </button>
                                    <button onClick={() => alert('Dépôt test')} className="bg-slate-800 border border-slate-700 text-slate-200 p-4 rounded-2xl font-bold flex flex-col items-center justify-center space-y-2">
                                        <i data-lucide="download" className="w-6 h-6 text-orange-400"></i><span>Recharger</span>
                                    </button>
                                </div>
                                <div className="mt-8 space-y-4">
                                    <h3 className="text-sm font-bold uppercase text-slate-400">Historique en temps réel</h3>
                                    <div className="space-y-3">
                                        {transactions.map(tx => (
                                            <div key={tx.id} className="bg-slate-800/50 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
                                                <div>
                                                    <p className="font-semibold text-sm text-white">Contact : {tx.name}</p>
                                                    <p className="text-xs text-slate-500">{tx.date}</p>
                                                </div>
                                                <span className={`font-bold text-sm ${tx.type === 'reception' ? 'text-emerald-400' : 'text-slate-200'}`}>
                                                    {tx.amount}
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {screen === 'send' && (
                        <div className="flex flex-col justify-between h-full py-2">
                            <div>
                                <button onClick={() => setScreen('dashboard')} className="text-slate-400 text-sm pt-2">← Retour</button>
                                <div className="mt-6 space-y-2">
                                    <h1 className="text-2xl font-bold text-white">Envoyer de l'argent</h1>
                                    <p className="text-slate-400 text-sm">Vers un autre compte KàdduPay.</p>
                                </div>
                                <form onSubmit={handleSendMoney} className="mt-6 space-y-4">
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-semibold text-slate-300 uppercase">Numéro du destinataire</label>
                                        <input type="tel" value={recipient} onChange={(e) => setRecipient(e.target.value)} placeholder="786303976" className="bg-slate-800 border border-slate-700 rounded-2xl p-3.5 w-full text-white focus:outline-none" required />
                                    </div>
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-semibold text-slate-300 uppercase">Montant (FCFA)</label>
                                        <input type="number" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0" className="bg-slate-800 border border-slate-700 rounded-2xl p-3.5 w-full text-2xl font-bold text-white focus:outline-none" required />
                                    </div>
                                    <button type="submit" className="w-full bg-gradient-to-r from-orange-600 to-amber-500 text-white font-bold py-4 rounded-2xl mt-4">Transférer instantanément</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
